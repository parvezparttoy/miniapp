/* NEON GRADIENT ANIMATED UNLOCK BUTTON */
.unlock-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius);
  border: 0;
  cursor: pointer;
  font-weight: 800;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  color: white;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 14px;

  background: linear-gradient(
    135deg,
    #ff0080,
    #ff8c00,
    #40e0d0,
    #ff0080,
    #ff8c00
  );
  background-size: 400% 400%;
  animation: neonGradient 3s ease infinite, neonPulse 2s ease-in-out infinite alternate;

  box-shadow:
    0 0 20px rgba(255, 0, 128, 0.5),
    0 0 40px rgba(255, 140, 0, 0.3),
    0 0 60px rgba(64, 224, 208, 0.2),
    inset 0 0 20px rgba(255, 255, 255, 0.1);

  border: 1px solid rgba(255, 255, 255, 0.2);
}

.unlock-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.4),
    transparent
  );
  transition: 0.6s;
}

.unlock-btn:hover::before {
  left: 100%;
}

.unlock-btn:hover {
  transform: translateY(-3px) scale(1.02);
  animation: none;
  background: linear-gradient(
    135deg,
    #ff0080,
    #ff8c00,
    #40e0d0,
    #ff0080
  );
  background-size: 400% 400%;
  animation: neonGradient 1.5s ease infinite, neonPulseHover 0.5s ease-in-out infinite alternate;

  box-shadow:
    0 0 30px rgba(255, 0, 128, 0.7),
    0 0 60px rgba(255, 140, 0, 0.5),
    0 0 90px rgba(64, 224, 208, 0.3),
    0 5px 20px rgba(0, 0, 0, 0.4),
    inset 0 0 25px rgba(255, 255, 255, 0.15);
}

.unlock-btn:active {
  transform: translateY(-1px) scale(1.01);
  box-shadow:
    0 0 15px rgba(255, 0, 128, 0.6),
    0 0 30px rgba(255, 140, 0, 0.4),
    0 0 45px rgba(64, 224, 208, 0.2),
    0 2px 10px rgba(0, 0, 0, 0.3);
}

.unlock-btn.loading {
  pointer-events: none;
  animation: none;
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  box-shadow: 0 0 20px rgba(79, 70, 229, 0.5);
}

.unlock-btn.loading::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  top: 50%;
  left: 50%;
  margin: -10px 0 0 -10px;
  border: 2px solid transparent;
  border-top: 2px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.unlock-btn.success {
  animation: none;
  background: linear-gradient(135deg, #00ff88, #00ccff);
  box-shadow:
    0 0 25px rgba(0, 255, 136, 0.6),
    0 0 50px rgba(0, 204, 255, 0.4);
}

.unlock-btn.success::before {
  content: '✓ ';
  position: static;
  background: none;
}

@keyframes neonGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes neonPulse {
  0% {
    box-shadow:
      0 0 20px rgba(255, 0, 128, 0.5),
      0 0 40px rgba(255, 140, 0, 0.3),
      0 0 60px rgba(64, 224, 208, 0.2),
      inset 0 0 20px rgba(255, 255, 255, 0.1);
  }
  100% {
    box-shadow:
      0 0 25px rgba(255, 0, 128, 0.7),
      0 0 45px rgba(255, 140, 0, 0.5),
      0 0 65px rgba(64, 224, 208, 0.3),
      inset 0 0 25px rgba(255, 255, 255, 0.15);
  }
}

@keyframes neonPulseHover {
  0% {
    box-shadow:
      0 0 30px rgba(255, 0, 128, 0.7),
      0 0 60px rgba(255, 140, 0, 0.5),
      0 0 90px rgba(64, 224, 208, 0.3),
      0 5px 20px rgba(0, 0, 0, 0.4),
      inset 0 0 25px rgba(255, 255, 255, 0.15);
  }
  100% {
    box-shadow:
      0 0 35px rgba(255, 0, 128, 0.8),
      0 0 65px rgba(255, 140, 0, 0.6),
      0 0 95px rgba(64, 224, 208, 0.4),
      0 7px 25px rgba(0, 0, 0, 0.5),
      inset 0 0 30px rgba(255, 255, 255, 0.2);
  }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes bounce {
  0%, 20%, 53%, 80%, 100% { transform: translate3d(0,0,0); }
  40%, 43% { transform: translate3d(0,-8px,0); }
  70% { transform: translate3d(0,-4px,0); }
}

.unlock-btn.bounce { animation: bounce 0.5s ease-in-out; }

<script>
// --- API Configuration ---
const API_BASE = 'your api';
const FILES_API = `${API_BASE}/files_public.php`;
const SETTINGS_API = `${API_BASE}/settings_public.php`;

// --- Helper Functions ---
function showToast(msg, t=3000){
  const toastEl = document.getElementById('toast');
  toastEl.textContent = msg;
  toastEl.style.display='block';
  clearTimeout(toastEl._to);
  toastEl._to = setTimeout(()=>toastEl.style.display='none', t);
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// --- SIMPLE API Request Wrapper ---
async function simpleApiRequest(url) {
    try {
        const response = await fetch(url, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data;
    } catch (error) {
        console.error('API Request Error:', error);
        return { success: false, message: error.message, data: [] };
    }
}

// --- State Variables ---
let settings = { ads_limit: 20, tutorial_youtube_id: '', channels: [], filters: [] };
let files = [];
let currentFilter = 'all';

// --- User Data Management ---
function getUserUid() {
  let deviceId = localStorage.getItem('device_id');
  if (!deviceId) {
    deviceId = 'd_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('device_id', deviceId);
  }
  return deviceId;
}

async function getUserDailyCount(uid){
  try{
    const raw = localStorage.getItem('user_daily_totals_' + uid);
    if(!raw) return 0;
    const p = JSON.parse(raw);
    return p.date === todayKey() ? (p.count||0) : 0;
  }catch(err){ return 0; }
}

async function getUserFileProgress(uid, fileId){
  try{
    const raw = localStorage.getItem('user_ad_progress_' + uid + '_' + fileId);
    return raw ? JSON.parse(raw) : { date: null, watched_today: 0, total_watched: 0 };
  }catch(err){
    return { date: null, watched_today: 0, total_watched: 0 };
  }
}

async function recordAdView(uid, fileId, increment=1){
  try {
    const totalKey = 'user_daily_totals_' + uid;
    let tot = JSON.parse(localStorage.getItem(totalKey) || '{}');
    if (tot.date === todayKey()) tot.count = (tot.count || 0) + increment;
    else tot = { date: todayKey(), count: increment };
    localStorage.setItem(totalKey, JSON.stringify(tot));

    const fileKey = 'user_ad_progress_' + uid + '_' + fileId;
    let fp = JSON.parse(localStorage.getItem(fileKey) || '{}');
    fp.total_watched = (fp.total_watched || 0) + increment;
    if (fp.date === todayKey()) fp.watched_today = (fp.watched_today || 0) + increment;
    else { fp.date = todayKey(); fp.watched_today = increment; }
    localStorage.setItem(fileKey, JSON.stringify(fp));
    return true;
  } catch(err) {
    console.error('Local storage update error:', err);
    return false;
  }
}

// --- Data Loading ---
async function loadSettings(){
  try{
    try {
      const cachedSettings = localStorage.getItem('cached_settings');
      if (cachedSettings) {
        const parsed = JSON.parse(cachedSettings);
        if (parsed.tutorial_youtube_id) settings.tutorial_youtube_id = parsed.tutorial_youtube_id;
        if (parsed.channels) settings.channels = parsed.channels;
        if (parsed.filters) settings.filters = parsed.filters;
        if (parsed.ads_limit) settings.ads_limit = parsed.ads_limit;
      }
    } catch (e) {}

    const response = await simpleApiRequest(SETTINGS_API);

    if(response.success && response.data){
      const d = response.data;
      settings.ads_limit = typeof d.ads_limit === 'number' ? d.ads_limit : settings.ads_limit;
      settings.tutorial_youtube_id = d.tutorial_youtube_id || settings.tutorial_youtube_id;
      settings.channels = d.channels || settings.channels || [];
      settings.filters = d.filters || [{id: 'all', name: 'All', count: 0}];

      localStorage.setItem('cached_settings', JSON.stringify({
        tutorial_youtube_id: settings.tutorial_youtube_id,
        channels: settings.channels,
        filters: settings.filters,
        ads_limit: settings.ads_limit
      }));
    } else {
      settings.filters = [{id: 'all', name: 'All', count: 0}];
    }

    renderFilterButtons();
    renderLinks();
    renderTutorial();

  }catch(e){
    console.warn('load settings error:', e);
    settings.filters = [{id: 'all', name: 'All', count: 0}];
    renderFilterButtons();
  }
}

async function fetchFiles(){
  try{
    const response = await simpleApiRequest(FILES_API);

    if(response.success){
        files = response.data || [];

        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('file');

        if (fileId) {
          const fileExists = files.some(f => f.id == fileId);
          if (!fileExists) {
            showToast('File not found. Showing all files.', 3000);
            showAllFiles();
          } else {
            if (document.getElementById('singleFileView').classList.contains('active')) {
              loadSingleFile(fileId);
            }
          }
        } else {
          calculateFilterCounts();
          renderFilterButtons();
          renderCards();
        }
    } else {
        console.warn('fetch files error:', response.message);
        files = getDemoFiles();
        document.getElementById('cards').innerHTML = '<div style="padding:12px;color:var(--text-muted)">Using demo data. API connection failed.</div>';
        calculateFilterCounts();
        renderFilterButtons();
        renderCards();
    }
  }catch(e){
    console.warn('fetch files error:', e);
    files = getDemoFiles();
    document.getElementById('cards').innerHTML = '<div style="padding:12px;color:var(--text-muted)">Using demo data. Please check connection.</div>';
    calculateFilterCounts();
    renderFilterButtons();
    renderCards();
  }
}

// --- UI Rendering ---
function calculateFilterCounts() {
  if (!settings.filters) return;

  settings.filters.forEach(filter => {
    if (filter.id === 'all') filter.count = files.length;
    else filter.count = files.filter(f => f.category === filter.id).length;
  });
}

function renderFilterButtons() {
  const container = document.getElementById('filterButtons');
  container.innerHTML = '';

  if (!settings.filters || settings.filters.length === 0) {
    settings.filters = [{id: 'all', name: 'All', count: 0}];
  }

  calculateFilterCounts();

  settings.filters.forEach(filter => {
    const btn = document.createElement('button');
    btn.className = `filter-btn ${filter.id === 'all' ? 'active' : ''}`;
    btn.innerHTML = `${filter.name}`;

    if (filter.count > 0) {
      const countBadge = document.createElement('span');
      countBadge.className = 'filter-count';
      countBadge.textContent = filter.count;
      btn.appendChild(countBadge);
    }

    btn.dataset.filter = filter.id;
    btn.addEventListener('click', () => {
      currentFilter = filter.id;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    });
    container.appendChild(btn);
  });
}

async function loadFileProgress(fileId, adsReq, isSingleView = false) {
  const uid = getUserUid();
  const prog = await getUserFileProgress(uid, fileId);
  const totalWatched = prog.total_watched || 0;

  const btnTextId = isSingleView ? `singleBtnText_${fileId}` : `btnText_${fileId}`;
  const btnTextEl = document.getElementById(btnTextId);

async function renderCards(){
  const container = document.getElementById('cards');
  container.innerHTML = '';

  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  let filteredFiles = files.filter(f => {
    const matchesSearch = (f.name||f.title||'').toLowerCase().includes(q) ||
                         (f.description||f.desc||'').toLowerCase().includes(q);
    const matchesFilter = currentFilter === 'all' ||
                         (f.category && f.category === currentFilter);
    return matchesSearch && matchesFilter;
  });

  if(filteredFiles.length === 0){
    container.innerHTML = '<div style="padding:12px;color:var(--text-muted)">No files found.</div>';
    return;
  }

  for(const f of filteredFiles) {
    const card = createCard(f);
    container.appendChild(card);

    const adsReq = parseInt(f.ad_watches_required || 1, 10);
    await loadFileProgress(f.id, adsReq, false);

    const likedArr = JSON.parse(localStorage.getItem('liked_files_' + getUserUid()) || '[]');
    const heartIcon = card.querySelector(`.heart[data-id="${f.id}"] i`);
    if(heartIcon) heartIcon.className = likedArr.includes(f.id) ? 'fas fa-heart' : 'far fa-heart';
  }

  document.querySelectorAll('.heart').forEach(b => b.addEventListener('click', onLikeClick));
  document.querySelectorAll('.unlock-btn').forEach(b => b.addEventListener('click', onUnlockClick));
  document.querySelectorAll('.copy-link-btn').forEach(b => b.addEventListener('click', onCopyLinkClick));
}

function onLikeClick(e){
  e.stopPropagation();
  const id = e.currentTarget.dataset.id;
  const uid = getUserUid();
  const key = 'liked_files_' + uid;
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(key) || '[]'); }catch(err){ arr=[]; }
  if(arr.includes(id)) arr = arr.filter(x=>x!==id); else arr.push(id);
  localStorage.setItem(key, JSON.stringify(arr));
  const heart = document.querySelector(`.heart[data-id="${id}"] i`);
  if(heart) heart.className = arr.includes(id) ? 'fas fa-heart' : 'far fa-heart';
}

function generateShareableLink(fileId) {
  const baseUrl = window.location.origin + window.location.pathname;
  return `${baseUrl}?file=${fileId}`;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('Link copied to clipboard!', 2000);
  }).catch(() => {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
    showToast('Link copied!', 2000);
  });
}

function onCopyLinkClick(e) {
  e.stopPropagation();
  const fileId = e.currentTarget.dataset.id;

  const shareableLink = generateShareableLink(fileId);
  copyToClipboard(shareableLink);

  const btn = e.currentTarget;
  btn.classList.add('copied');
  btn.innerHTML = '<i class="fas fa-check"></i>';

  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = '<i class="fas fa-link"></i>';
  }, 2000);
}

function showMonetagAd() {
  return new Promise((resolve, reject) => {
    try {
      if (typeof window.show_10531261 === 'function') {
        window.show_10531261().then(resolve).catch(reject);
      } else {
        console.warn('Monetag SDK function not found');
        setTimeout(resolve, 15000);
      }
    } catch (error) {
      reject(error);
    }
  });
}

async function onUnlockClick(e){
  const btn = e.currentTarget;
  const btnText = btn.querySelector('.btn-text');
  const originalText = btnText.textContent;

  btn.classList.add('loading', 'pulse');
  btn.disabled = true;

  const fileId = btn.dataset.id;
  const requiredAds = parseInt(btn.dataset.ads,10) || 1;
  const perFileDaily = parseInt(btn.dataset.daily,10) || settings.ads_limit;
  const uid = getUserUid();

  try{
    const todayCount = await getUserDailyCount(uid);
    if(todayCount >= (settings.ads_limit || 20)){
      showToast('আজকের ভিডিও দেখার limit শেষ — কালকে আবার ভিডিও দেখতে পারবেন।',4000);
      btn.classList.remove('loading', 'pulse');
      btn.disabled = false;
      return;
    }

    const fileProg = await getUserFileProgress(uid, fileId);
    const alreadyTotal = fileProg.total_watched || 0;

    if(alreadyTotal >= requiredAds){
      const f = files.find(x=>x.id == fileId) || {};

      btn.classList.remove('loading');
      btn.classList.add('success', 'bounce');
      btnText.textContent = 'Unlocked!';
      setTimeout(() => {
        btn.classList.remove('success', 'bounce');
        btnText.textContent = originalText;
        btn.disabled = false;
      }, 2000);

      const downloadUrl = f.download_link || f.download || f.url || f.link || f.download_url || f.file_url || f.video_url;

      if(downloadUrl && downloadUrl.toString().trim() !== '') {
          window.open(downloadUrl.toString().trim(), '_blank');
      } else {
          // ✅ admin রেফারেন্স রিমুভ করা হলো
          showToast('Download link not available.', 4000);
      }
      return;
    }

    const watchedToday = (fileProg && fileProg.date === todayKey()) ? (fileProg.watched_today || 0) : 0;
    if(watchedToday >= perFileDaily){
      showToast('এই ফাইলের আজকের লিমিট শেষ।',3000);
      btn.classList.remove('loading', 'pulse');
      btn.disabled = false;
      return;
    }

    await showMonetagAd()
      .then(async () => {
        const success = await recordAdView(uid, fileId, 1);
        if (!success) {
          showToast('কাউন্ট সেভ হয়নি — আবার চেষ্টা করুন', 4000);
          btn.classList.remove('loading', 'pulse');
          btn.disabled = false;
          return;
        }

        const prog = await getUserFileProgress(uid, fileId);
        const totalAfter = prog.total_watched || 0;

        const btnTextId = document.getElementById('singleFileView').classList.contains('active')
          ? `singleBtnText_${fileId}`
          : `btnText_${fileId}`;

        const btnTextEl = document.getElementById(btnTextId);
        if(btnTextEl) btnTextEl.textContent = `UNLOCK — ${totalAfter}/${requiredAds} ADS`;

        btn.classList.remove('loading');
        btn.classList.add('pulse');

        if(totalAfter >= requiredAds){
          showToast('ফাইল আনলক! ডাউনলোড শুরু...',2000);
          const f = files.find(x=>x.id == fileId) || {};

          btn.classList.add('success');
          btnText.textContent = 'Unlocked!';
          setTimeout(() => {
            btn.classList.remove('success', 'pulse');
            btnText.textContent = `UNLOCK — ${totalAfter}/${requiredAds} ADS`;
            btn.disabled = false;
          }, 3000);

          const downloadUrl = f.download_link || f.download || f.url || f.link || f.download_url || f.file_url || f.video_url;

          if(downloadUrl && downloadUrl.toString().trim() !== '') {
              window.open(downloadUrl.toString().trim(), '_blank');
          } else {
              // ✅ admin রেফারেন্স রিমুভ করা হলো
              showToast('Download link not available.', 4000);
          }
        } else {
          showToast(`${totalAfter}/${requiredAds} সম্পূর্ণ - আবার Unlock ক্লিক করুন`,3000);
          setTimeout(() => {
            btn.classList.remove('pulse');
            btn.disabled = false;
          }, 1000);
        }
      })
      .catch((e) => {
        console.warn('Monetag ad failed:', e);
        showToast('আপনি ১৫ সেকেন্ড ads দেখেননি - পুরো সময় দেখুন',4000);
        btn.classList.remove('loading', 'pulse');
        btn.disabled = false;
      });

  }catch(err){
    console.error('unlock error:', err);
    showToast('ত্রুটি — আবার চেষ্টা করুন',3000);
    btn.classList.remove('loading', 'pulse');
    btn.disabled = false;
  }
}

  async function renderLiked(){
  const uid = getUserUid();
  const key = 'liked_files_' + uid;
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ arr = []; }
  const container = document.getElementById('likedCards');
  container.innerHTML = '';
  if(arr.length === 0){
    container.innerHTML = '<div class="tutorial-container"><div style="color:var(--text-muted);text-align:center">No liked items yet.</div></div>';
    return;
  }
  for(const id of arr){
    const f = files.find(x=>x.id == id);
    if(!f) continue;
    const card = createCard(f);
    container.appendChild(card);
  }
  document.querySelectorAll('.heart').forEach(b => b.addEventListener('click', onLikeClick));
  document.querySelectorAll('.unlock-btn').forEach(b => b.addEventListener('click', onUnlockClick));
  document.querySelectorAll('.copy-link-btn').forEach(b => b.addEventListener('click', onCopyLinkClick));
}

// MAIN INITIALIZATION
(async function init(){
  const fileId = checkInitialView();

  await loadSettings();
  await fetchFiles();

  if (fileId && document.getElementById('singleFileView').classList.contains('active')) {
    await loadSingleFile(fileId);
  }
})();
  setInterval(async () => {
  await fetchFiles();
  console.log('Files auto-refreshed');
}, 30000);
</script>
