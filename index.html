<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VIRAL ZONE — Exclusive Video Access</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Monetag Ads Script -->
<script src='//libtl.com/sdk.js' data-zone='10531261' data-sdk='show_10531261'></script>

<style>
/* ==== CSS EXACT SAME (unchanged) ==== */
:root {
  --primary:#7e22ce;
  --primary-light:#a855f7;
  --bg-dark:#0f0f23;
  --bg-card:#1a1a2e;
  --bg-panel:#1e1e30;
  --text-light:#f3f4f6;
  --text-muted:#c7d2fe;
  --border:rgba(124,58,237,.2);
  --radius:14px;
  --shadow:0 10px 25px rgba(0,0,0,.3);
}
*{box-sizing:border-box;font-family:Poppins,system-ui}
body{
  margin:0;
  background:linear-gradient(135deg,var(--bg-dark),#1e1b4b);
  color:var(--text-light);
}
.app{max-width:900px;margin:auto;padding:16px}
.header{
  text-align:center;
  background:var(--bg-panel);
  padding:20px;
  border-radius:var(--radius);
  border:1px solid var(--border);
}
.title{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,var(--primary-light),#e879f9);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{color:var(--text-muted);font-size:14px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px;padding-bottom:120px}
.card{
  background:var(--bg-card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.media{position:relative;padding-bottom:56.25%}
.media img{position:absolute;width:100%;height:100%;object-fit:cover}
.meta{padding:16px}
.meta h3{margin:0 0 6px}
.meta p{margin:0;color:var(--text-muted);font-size:14px}
.row{display:flex;gap:8px;margin-top:12px}

.unlock-btn{
  flex:1;
  padding:14px;
  border:0;
  border-radius:var(--radius);
  font-weight:800;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#ff0080,#ff8c00,#40e0d0);
}
.unlock-btn[disabled]{background:#334155;cursor:not-allowed}

.bottom-nav{
  position:fixed;
  left:12px;right:12px;bottom:12px;
  background:var(--bg-panel);
  border-radius:999px;
  display:flex;
  justify-content:space-around;
  padding:10px;
}
.nav-btn{
  background:none;border:0;color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;
}
.nav-btn.active{color:var(--primary-light)}
</style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="title">VIRAL ZONE 🔥</div>
    <div class="subtitle">Exclusive Premium Access</div>
  </header>

  <div id="cards" class="cards"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active"><i class="fas fa-home"></i><div>হোম</div></button>
    <button class="nav-btn"><i class="fas fa-heart"></i><div>পছন্দের</div></button>
    <button class="nav-btn"><i class="fas fa-book-open"></i><div>টিউটোরিয়াল</div></button>
    <button class="nav-btn"><i class="fas fa-link"></i><div>লিংক</div></button>
  </nav>
</div>

<script>
/* ===== STATIC DATA (ADMIN REMOVED) ===== */
const REQUIRED_ADS = 5;

const FILES = [
 {id:"p1",title:"বাংলাদেশি ভাইরাল ভিডিও",desc:"Premium content unlock করুন",img:"https://picsum.photos/600/400?1"},
 {id:"p2",title:"TikTok Viral Clip",desc:"Ads দেখে আনলক করুন",img:"https://picsum.photos/600/400?2"},
 {id:"p3",title:"Exclusive Private Video",desc:"Only for members",img:"https://picsum.photos/600/400?3"}
];

function getCount(id){
 return Number(localStorage.getItem("ads_"+id)||0);
}

async function showAdAndCount(id){
 if(!window.show_10531261){
   alert("Ad not ready");
   return;
 }
 await window.show_10531261(); // must complete
 let c=getCount(id)+1;
 localStorage.setItem("ads_"+id,c);
 render();
 if(c>=REQUIRED_ADS){
   alert("Unlocked ✅");
 }
}

function render(){
 const box=document.getElementById("cards");
 box.innerHTML="";
 FILES.forEach(f=>{
   const c=getCount(f.id);
   box.innerHTML+=`
   <div class="card">
     <div class="media"><img src="${f.img}"></div>
     <div class="meta">
       <h3>${f.title}</h3>
       <p>${f.desc}</p>
       <div class="row">
         <button class="unlock-btn" ${c>=REQUIRED_ADS?"disabled":""}
           onclick="showAdAndCount('${f.id}')">
           ${c>=REQUIRED_ADS?"UNLOCKED":"UNLOCK – "+c+"/"+REQUIRED_ADS}
         </button>
       </div>
     </div>
   </div>`;
 });
}
render();
</script>
</body>
</html>
