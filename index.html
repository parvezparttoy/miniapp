<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VIRAL ZONE — Exclusive Video Access</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #7e22ce;
  --primary-light: #a855f7;
  --primary-dark: #581c87;
  --secondary: #c084fc;
  --accent: #e879f9;
  --bg-dark: #0f0f23;
  --bg-card: #1a1a2e;
  --bg-panel: #1e1e30;
  --text-light: #f3f4f6;
  --text-muted: #c7d2fe;
  --border: rgba(124, 58, 237, 0.2);
  --radius: 14px;
  --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

* {
  box-sizing: border-box;
  font-family: 'Poppins', system-ui, Arial;
}

html, body {
  height: 100%;
  margin: 0;
  background: linear-gradient(135deg, var(--bg-dark), #1e1b4b);
  color: var(--text-light);
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
}

/* SINGLE FILE VIEW STYLES */
.single-file-view {
  display: none;
}

.single-file-view.active {
  display: block;
  min-height: 100vh;
  padding-top: 20px;
}

.back-btn {
  margin-bottom: 20px;
  width: 100%;
}

.single-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.single-card .media {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 56.25%;
  background: var(--bg-dark);
}

.single-card .media img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.single-card .heart {
  position: absolute;
  right: 12px;
  top: 12px;
  background: rgba(0, 0, 0, 0.6);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  border: 0;
  cursor: pointer;
  transition: all 0.3s;
  z-index: 2;
}

.single-card .heart:hover {
  background: rgba(0, 0, 0, 0.8);
  color: var(--accent);
}

.single-card .meta {
  padding: 20px;
}

.single-card .meta h3 {
  margin: 0 0 12px 0;
  font-size: 22px;
  color: var(--text-light);
}

.single-card .meta p {
  margin: 0 0 20px 0;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.5;
}

.single-card .row {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 20px;
}

/* NORMAL APP VIEW */
.normal-app-view {
  display: block;
}

.normal-app-view.hidden {
  display: none;
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  margin-bottom: 20px;
  padding: 20px 16px;
  background: var(--bg-panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.title {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(90deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.subtitle {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.5px;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  align-items: center;
}

.input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(30, 30, 48, 0.7);
  color: var(--text-light);
  outline: none;
  transition: all 0.3s;
}

.input:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
}

.btn {
  padding: 12px 20px;
  border-radius: var(--radius);
  border: 0;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-light);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: rgba(124, 58, 237, 0.1);
  border-color: var(--primary-light);
}

/* Bottom nav & sections */
.bottom-nav {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  margin: 0 auto;
  max-width: 900px;
  background: var(--bg-panel);
  border-radius: 999px;
  padding: 10px;
  display: flex;
  justify-content: space-around;
  backdrop-filter: blur(10px);
  z-index: 2000;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.nav-btn {
  background: transparent;
  border: 0;
  color: var(--text-muted);
  font-size: 13px;
  padding: 10px;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 60px;
}

.nav-btn.active {
  color: var(--primary-light);
  background: rgba(124, 58, 237, 0.1);
}

.section {
  display: none;
}

.section.active {
  display: block;
}
</style>
</head>

<body>
<div class="app">

  <!-- SINGLE FILE VIEW (STATIC) -->
  <div id="singleFileView" class="single-file-view active">
    <button class="btn btn-secondary back-btn">
      <i class="fas fa-arrow-left"></i> Back to All Files
    </button>
    <div class="single-card">
      <div class="media">
        <img src="https://via.placeholder.com/800x450" alt="Sample">
      </div>
      <div class="meta">
        <h3>Sample Video 1</h3>
        <p>This is a sample video description.</p>
        <div class="row">
          <button class="unlock-btn">
            <span class="btn-text">UNLOCK — 0/3 ADS</span>
          </button>
          <button class="copy-link-btn">
            <i class="fas fa-link"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- NORMAL APP VIEW -->
  <div id="normalAppView" class="normal-app-view active">
    <header class="header">
      <div class="brand">
        <div class="title">VIRAL ZONE 🔥</div>
        <div class="subtitle">Exclusive Premium Access</div>
      </div>
    </header>

    <div id="homeSection" class="section active">
      <div class="controls">
        <input class="input" placeholder="Search title or description..." />
        <button class="btn btn-primary">
          <i class="fas fa-search"></i> Search
        </button>
      </div>

      <div class="cards">
        <div class="card">
          <div class="media">
            <img src="https://via.placeholder.com/800x450" alt="Sample">
          </div>
          <div class="meta">
            <h3>Sample Video 1</h3>
            <p>This is a sample video description.</p>
            <div class="row">
              <button class="unlock-btn"><span class="btn-text">UNLOCK — 0/3 ADS</span></button>
              <button class="copy-link-btn"><i class="fas fa-link"></i></button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="media">
            <img src="https://via.placeholder.com/800x450" alt="Sample">
          </div>
          <div class="meta">
            <h3>Sample Video 2</h3>
            <p>Another sample video for testing.</p>
            <div class="row">
              <button class="unlock-btn"><span class="btn-text">UNLOCK — 0/5 ADS</span></button>
              <button class="copy-link-btn"><i class="fas fa-link"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active">
      <i class="fas fa-home"></i>
      <div>হোম</div>
    </button>
    <button class="nav-btn">
      <i class="fas fa-heart"></i>
      <div>পছন্দের</div>
    </button>
    <button class="nav-btn">
      <i class="fas fa-book-open"></i>
      <div>টিউটোরিয়াল</div>
    </button>
    <button class="nav-btn">
      <i class="fas fa-link"></i>
      <div>লিংক</div>
    </button>
  </nav>

</div>
</body>
              </html>
