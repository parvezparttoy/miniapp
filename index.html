<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VIRAL ZONE — Exclusive Video Access</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ✅ Adexora Ads Script -->
  <script src="https://adexora.com/cdn/ads.js?id=1913"></script>

  <style>
    :root {
      --primary: #7e22ce;
      --primary-light: #a855f7;
      --primary-dark: #581c87;
      --secondary: #c084fc;
      --accent: #e879f9;
      --bg-dark: #0f0f23;
      --bg-card: #1a1a2e;
      --bg-panel: #1e1e30;
      --text-light: #f3f4f6;
      --text-muted: #c7d2fe;
      --border: rgba(124, 58, 237, 0.2);
      --radius: 14px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; font-family: 'Poppins', system-ui, Arial; }
    html, body { height: 100%; margin: 0; background: linear-gradient(135deg, var(--bg-dark), #1e1b4b); color: var(--text-light); -webkit-font-smoothing: antialiased; }
    .app { max-width: 900px; margin: 0 auto; padding: 16px; }

    .header {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
      margin-bottom: 20px; padding: 20px 16px; background: var(--bg-panel);
      border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .title {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .subtitle { font-size: 14px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }

    .controls { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .input {
      flex: 1; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: rgba(30, 30, 48, 0.7); color: var(--text-light); outline: none; transition: all 0.3s;
    }
    .input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2); }

    .btn {
      padding: 12px 20px; border-radius: var(--radius); border: 0; cursor: pointer; font-weight: 700;
      transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      position: relative; overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5); }

    .cards { display: flex; flex-direction: column; gap: 20px; padding-bottom: 140px; }
    .card {
      background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border); box-shadow: var(--shadow); transition: all 0.3s;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4); border-color: var(--primary-light); }

    .media { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; background: var(--bg-dark); }
    .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .meta { padding: 16px; }
    .meta h3 { margin: 0 0 8px 0; font-size: 18px; }
    .meta p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.4; }

    .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }

    /* Neon unlock/watch button */
    .unlock-btn {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius);
      border: 0;
      cursor: pointer;
      font-weight: 800;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 14px;
      background: linear-gradient(135deg,#ff0080,#ff8c00,#40e0d0,#ff0080,#ff8c00);
      background-size: 400% 400%;
      animation: neonGradient 3s ease infinite, neonPulse 2s ease-in-out infinite alternate;
      box-shadow:
        0 0 20px rgba(255, 0, 128, 0.5),
        0 0 40px rgba(255, 140, 0, 0.3),
        0 0 60px rgba(64, 224, 208, 0.2),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .unlock-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: 0.6s;
    }
    .unlock-btn:hover::before { left: 100%; }
    .unlock-btn:active { transform: translateY(-1px) scale(1.01); }

    .unlock-btn.loading {
      pointer-events: none;
      animation: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.5);
    }
    .unlock-btn.loading::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      top: 50%; left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid transparent;
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .unlock-btn.watch {
      animation: none;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.6), 0 0 50px rgba(0, 204, 255, 0.4);
    }

    .copy-link-btn {
      background: var(--bg-panel);
      color: var(--text-light);
      border: 1px solid var(--border);
      width: 44px; height: 44px;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; flex-shrink: 0;
    }
    .copy-link-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; color: #3b82f6; }
    .copy-link-btn.copied { background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981; }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 150px; background: var(--bg-panel);
      padding: 12px 20px; border-radius: var(--radius);
      color: white; z-index: 3000;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: none;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from {opacity:0; transform:translateX(-50%) translateY(20px)} to {opacity:1; transform:translateX(-50%) translateY(0)} }
    @keyframes neonGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes neonPulse { 0% { box-shadow:0 0 20px rgba(255,0,128,.5),0 0 40px rgba(255,140,0,.3),0 0 60px rgba(64,224,208,.2),inset 0 0 20px rgba(255,255,255,.1)} 100% { box-shadow:0 0 25px rgba(255,0,128,.7),0 0 45px rgba(255,140,0,.5),0 0 65px rgba(64,224,208,.3),inset 0 0 25px rgba(255,255,255,.15)} }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .bottom-nav {
      position: fixed; left: 12px; right: 12px; bottom: 12px; margin: 0 auto; max-width: 900px;
      background: var(--bg-panel); border-radius: 999px; padding: 10px;
      display: flex; justify-content: space-around;
      backdrop-filter: blur(10px);
      z-index: 2000; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .nav-btn {
      background: transparent; border: 0; color: var(--text-muted);
      font-size: 13px; padding: 10px; border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: all 0.3s; min-width: 60px;
    }
    .nav-btn.active { color: var(--primary-light); background: rgba(124, 58, 237, 0.1); }

    .section { display: none; }
    .section.active { display: block; }

    .tutorial-container { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
    @media (min-width: 900px) { .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    @media (max-width: 520px) { .title { font-size: 24px; } }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="title">VIRAL ZONE 🔥</div>
        <div class="subtitle">Exclusive Premium Access</div>
      </div>
    </header>

    <div id="homeSection" class="section active">
      <div class="controls">
        <input id="searchInput" class="input" placeholder="Search title or description..." />
        <button id="searchBtn" class="btn btn-primary"><i class="fas fa-search"></i> Search</button>
      </div>
      <div id="cards" class="cards"></div>
    </div>

    <section id="tutorialSection" class="section">
      <h3 class="title" style="margin:8px 0; font-size:22px"><i class="fas fa-book-open"></i> টিউটোরিয়াল</h3>
      <div class="tutorial-container">
        <div id="tutorialEmbed" style="position:relative;padding-bottom:56.25%;height:0;margin-bottom:12px"></div>
        <div style="color:var(--text-muted);font-size:14px;line-height:1.5">
          ১) Unlock চাপুন → ২) Ads দেখুন → ৩) ৫টি Ads শেষ হলে Watch Video আসবে → ৪) Watch Video চাপলে লিংক ওপেন হবে এবং আবার 0 থেকে শুরু হবে।
        </div>
      </div>
    </section>

    <section id="linksSection" class="section">
      <h3 class="title" style="margin:8px 0; font-size:22px"><i class="fas fa-link"></i> Useful Links</h3>
      <div id="linksList" class="cards"></div>
    </section>

    <div id="toast" class="toast"></div>

    <nav class="bottom-nav">
      <button id="navHome" class="nav-btn active"><i class="fas fa-home"></i><div>হোম</div></button>
      <button id="navTutorial" class="nav-btn"><i class="fas fa-book-open"></i><div>টিউটোরিয়াল</div></button>
      <button id="navLinks" class="nav-btn"><i class="fas fa-link"></i><div>লিংক</div></button>
    </nav>
  </div>

<script>
/** =========================
 *  DATA (9 posts) + stable order
 *  ========================= */
const POSTS = [
  // ✅ এখানে আপনার photo/title/desc/reward_link বসাবেন (আইনসঙ্গত/অনুমতিপ্রাপ্ত কনটেন্ট)
  { id: 1, order: 1, photo: "https://via.placeholder.com/800x450?text=1", title: "Jannat Toha", desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward1" },
  { id: 2, order: 2, photo: "https://via.placeholder.com/800x450?text=2", title: "Ohtoi",      desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward2" },
  { id: 3, order: 3, photo: "https://via.placeholder.com/800x450?text=3", title: "Ridhii",     desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward3" },
  { id: 4, order: 4, photo: "https://via.placeholder.com/800x450?text=4", title: "Afreen",     desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward4" },
  { id: 5, order: 5, photo: "https://via.placeholder.com/800x450?text=5", title: "Ratri",      desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward5" },
  { id: 6, order: 6, photo: "https://via.placeholder.com/800x450?text=6", title: "Mim",        desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward6" },
  { id: 7, order: 7, photo: "https://via.placeholder.com/800x450?text=7", title: "Sofiq",      desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward7" },
  { id: 8, order: 8, photo: "https://via.placeholder.com/800x450?text=8", title: "Bangladeshi",desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward8" },
  { id: 9, order: 9, photo: "https://via.placeholder.com/800x450?text=9", title: "Nadia",      desc: "৫টি বিজ্ঞাপন দেখার পর লিংক অটো ওপেন হবে 🎬", reward_link: "https://example.com/reward9" },
];

const REQUIRED_ADS = 5;
const DEFAULT_YT_ID = "M7lc1UVf-VE"; // tutorial default (পরে change করবেন)

// links section: 2 channel buttons
const CHANNEL_LINKS = [
  { name: "Channel One", url: "https://example.com/channel1" },
  { name: "Channel Two", url: "https://example.com/channel2" },
];

/** =========================
 *  HELPERS
 *  ========================= */
function showToast(msg, t=2600){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._to);
  el._to = setTimeout(()=> el.style.display='none', t);
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uid(){
  let v = localStorage.getItem('device_id');
  if(!v){ v = 'd_' + Math.random().toString(36).slice(2,11); localStorage.setItem('device_id', v); }
  return v;
}

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function progKey(postId){ return `ad_prog_${uid()}_${postId}`; }

function getProgress(postId){
  try{
    const raw = localStorage.getItem(progKey(postId));
    if(!raw) return { date: todayKey(), watched: 0 };
    const p = JSON.parse(raw);
    if(p.date !== todayKey()) return { date: todayKey(), watched: 0 };
    return { date: p.date, watched: Number(p.watched||0) };
  }catch(_){ return { date: todayKey(), watched: 0 }; }
}

function setProgress(postId, watched){
  localStorage.setItem(progKey(postId), JSON.stringify({ date: todayKey(), watched }));
}

/** =========================
 *  ✅ ADEXORA AD WRAPPER
 *  ========================= */
function showAdexoraAd(){
  return new Promise((resolve, reject) => {
    try{
      if (typeof window.showAdexora === 'function') {
        window.showAdexora()
          .then(() => resolve(true))
          .catch(err => reject(err));
      } else {
        reject('Adexora not loaded');
      }
    }catch(e){
      reject(e);
    }
  });
}

/** =========================
 *  RENDER
 *  ========================= */
function cardHtml(p){
  const pr = getProgress(p.id);
  const done = pr.watched >= REQUIRED_ADS;
  const btnText = done ? "Watch Video" : `UNLOCK — ${pr.watched}/${REQUIRED_ADS} ADS`;
  return `
    <article class="card" data-id="${p.id}">
      <div class="media">
        <img src="${esc(p.photo)}" onerror="this.src='https://via.placeholder.com/800x450?text=No+Image'">
      </div>
      <div class="meta">
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc)}</p>
        <div class="row">
          <button class="unlock-btn ${done?'watch':''}" data-id="${p.id}">
            <span class="btn-text">${btnText}</span>
          </button>
          <button class="copy-link-btn" data-id="${p.id}" title="Copy share link">
            <i class="fas fa-link"></i>
          </button>
        </div>
      </div>
    </article>
  `;
}

function render(){
  const q = (document.getElementById('searchInput').value || '').toLowerCase();

  // ✅ stable order
  const list = [...POSTS]
    .sort((a,b)=> (a.order||0) - (b.order||0))
    .filter(p => (p.title||'').toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));

  const wrap = document.getElementById('cards');
  wrap.innerHTML = list.map(cardHtml).join('') || `<div style="color:var(--text-muted);padding:10px">No posts found.</div>`;

  wrap.querySelectorAll('.unlock-btn').forEach(b => b.addEventListener('click', onUnlock));
  wrap.querySelectorAll('.copy-link-btn').forEach(b => b.addEventListener('click', onCopy));
}

/** =========================
 *  UNLOCK LOGIC
 *  =========================
 *  5 ads complete -> Watch Video
 *  Watch Video tap -> open reward_link + reset to 0
 */
async function onUnlock(e){
  const btn = e.currentTarget;
  const id = Number(btn.dataset.id);
  const post = POSTS.find(x=>x.id===id);
  if(!post) return;

  const pr = getProgress(id);
  const done = pr.watched >= REQUIRED_ADS;

  // ✅ Watch Video
  if(done){
    if(post.reward_link){
      window.open(String(post.reward_link), '_blank');
    } else {
      showToast('Reward link set করা নেই', 2800);
    }
    setProgress(id, 0);
    showToast('Count reset ✅ আবার Ads দেখে Unlock করুন', 2800);
    render();
    return;
  }

  // ✅ Show Adexora ad then +1
  btn.classList.add('loading');
  try{
    await showAdexoraAd(); // ✅ ADEXORA
    const after = Math.min(REQUIRED_ADS, pr.watched + 1);
    setProgress(id, after);

    if(after >= REQUIRED_ADS){
      showToast('৫টি Ads সম্পন্ন ✅ এখন Watch Video এসেছে', 3000);
    } else {
      showToast(`${after}/${REQUIRED_ADS} সম্পন্ন — আবার Unlock চাপুন`, 2600);
    }
    render();
  }catch(err){
    console.warn('Adexora ad failed:', err);
    showToast('Ad সম্পূর্ণ হয়নি — আবার চেষ্টা করুন', 3200);
  }finally{
    btn.classList.remove('loading');
  }
}

/** Share link */
function shareLink(postId){
  const base = window.location.origin + window.location.pathname;
  return `${base}?post=${postId}`;
}

function onCopy(e){
  const id = e.currentTarget.dataset.id;
  const link = shareLink(id);
  const btn = e.currentTarget;

  if(navigator.clipboard){
    navigator.clipboard.writeText(link).then(()=>{
      btn.classList.add('copied');
      btn.innerHTML = '<i class="fas fa-check"></i>';
      showToast('Link copied ✅', 2000);
      setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML = '<i class="fas fa-link"></i>'; }, 1800);
    });
  }else{
    showToast('Copy support নেই', 2200);
  }
}

/** NAV + Tutorial + Links */
function switchSection(secId, navId){
  document.querySelectorAll('.section').forEach(s=> s.classList.remove('active'));
  document.getElementById(secId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.remove('active'));
  document.getElementById(navId).classList.add('active');
}

document.getElementById('navHome').addEventListener('click', ()=> switchSection('homeSection','navHome'));
document.getElementById('navTutorial').addEventListener('click', ()=> switchSection('tutorialSection','navTutorial'));
document.getElementById('navLinks').addEventListener('click', ()=> switchSection('linksSection','navLinks'));

document.getElementById('searchBtn').addEventListener('click', render);
document.getElementById('searchInput').addEventListener('keyup', (ev)=>{ if(ev.key==='Enter') render(); });

function renderTutorial(){
  const el = document.getElementById('tutorialEmbed');
  el.innerHTML = `<iframe src="https://www.youtube.com/embed/${DEFAULT_YT_ID}?rel=0" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe>`;
}

function renderLinks(){
  const wrap = document.getElementById('linksList');
  wrap.innerHTML = CHANNEL_LINKS.map(c=>`
    <div class="card" style="padding:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <i class="fas fa-link" style="font-size:18px"></i>
        <div style="flex:1">
          <div style="font-weight:800">${esc(c.name)}</div>
          <div style="color:var(--text-muted);font-size:13px">${esc(c.url)}</div>
        </div>
        <a class="btn btn-primary" style="padding:10px 12px;text-decoration:none" href="${esc(c.url)}" target="_blank">Open</a>
      </div>
    </div>
  `).join('');
}

/** INIT */
(function init(){
  renderTutorial();
  renderLinks();
  render();
})();
</script>
</body>
  </html>
