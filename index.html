<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viral Zone</title>

<script src="https://adexora.com/cdn/ads.js?id=650"></script>

<style>
body{
  margin:0;
  background:#0b0a1a;
  color:#fff;
  font-family:system-ui;
}
.header{
  padding:16px;
  background:linear-gradient(90deg,#6d28d9,#9333ea);
  border-radius:0 0 22px 22px;
}
.header h2{margin:0}
.header p{opacity:.85;margin:4px 0 0}
.card{
  margin:16px;
  background:#11102a;
  border-radius:20px;
  padding:14px;
}
.card img{
  width:100%;
  border-radius:16px;
}
.unlock{
  margin-top:12px;
  width:100%;
  padding:14px;
  border-radius:16px;
  border:0;
  font-weight:900;
  background:linear-gradient(90deg,#fb7185,#facc15);
}
.unlock[disabled]{
  background:#334155;
  color:#94a3b8;
}
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:#062012;
  padding:10px 16px;
  border-radius:12px;
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h2>🔥 VIRAL ZONE</h2>
  <p>Exclusive Premium Access</p>
</div>

<div id="posts"></div>

<div id="toast" class="toast"></div>

<script>
/* ================= CONFIG ================= */
const REQUIRED = 5;
let adBusy = false;

/* আলাদা আলাদা demo reward link */
const REWARD_LINKS = {
  p1:"https://example.com/demo1",
  p2:"https://example.com/demo2",
  p3:"https://example.com/demo3",
  p4:"https://example.com/demo4",
  p5:"https://example.com/demo5",
  p6:"https://example.com/demo6",
  p7:"https://example.com/demo7",
  p8:"https://example.com/demo8"
};

/* ================= POSTS ================= */
const POSTS = [
 {id:"p1",title:"Jannat Toha Viral Video",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/images%20(99).jpeg"},
 {id:"p2",title:"Ridhii Moni Viral Video",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/main/IMG_20251018_194758_066.jpg"},
 {id:"p3",title:"Era Moni Viral Video",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/main/IMG_20251016_155725_290.jpg"},
 {id:"p4",title:"Othoi TikToker",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251112_172356_482.jpg"},
 {id:"p5",title:"Riddhi TikToker",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251112_173647_302.jpg"},
 {id:"p6",title:"Afrin Moni TikTok",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251112_174614_584.jpg"},
 {id:"p7",title:"Kids Viral Video",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251015_011606_673.jpg"},
 {id:"p8",title:"Nadiya Viral Video",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251119_084017_616.jpg"}
];

/* ================= HELPERS ================= */
function toast(msg){
 const t=document.getElementById("toast");
 t.innerText=msg;
 t.style.display="block";
 setTimeout(()=>t.style.display="none",1500);
}

/* ================= ADS LOGIC ================= */
function waitForAdexora(){
 return new Promise((res,rej)=>{
  let t=0;
  const i=setInterval(()=>{
   if(window.showAdexora){
    clearInterval(i);res();
   }
   t+=100;
   if(t>5000){clearInterval(i);rej();}
  },100);
 });
}

async function showAd(id){
 if(adBusy) return;
 adBusy=true;

 try{
  await waitForAdexora();
  await window.showAdexora(); // must complete

  let key="ads_"+id;
  let c=Number(localStorage.getItem(key)||0);
  if(c<REQUIRED){
    c++;
    localStorage.setItem(key,c);
    toast("+1 Ads Completed ✅");
    updateCard(id,c);
  }
 }catch{
  toast("Ad not completed ❌");
 }

 adBusy=false;
}

/* ================= UI ================= */
function updateCard(id,c){
 const btn=document.getElementById("btn_"+id);
 btn.innerText=`UNLOCK – ${c}/${REQUIRED} ADS`;
 if(c>=REQUIRED){
  btn.innerText="UNLOCKED ✅";
  btn.disabled=true;
  window.open(REWARD_LINKS[id],"_blank");
 }
}

function render(){
 const box=document.getElementById("posts");
 box.innerHTML="";
 POSTS.forEach(p=>{
  const c=Number(localStorage.getItem("ads_"+p.id)||0);
  box.innerHTML+=`
   <div class="card">
    <img src="${p.img}">
    <h3>${p.title}</h3>
    <p>Unlock এ ক্লিক করে Ads দেখে আনলক করুন</p>
    <button id="btn_${p.id}" class="unlock" ${c>=REQUIRED?"disabled":""}
      onclick="showAd('${p.id}')">
      ${c>=REQUIRED?"UNLOCKED ✅":`UNLOCK – ${c}/${REQUIRED} ADS`}
    </button>
   </div>
  `;
 });
}

render();
</script>

</body>
</html>
