/* NEON GRADIENT ANIMATED UNLOCK BUTTON */
.unlock-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius);
  border: 0;
  cursor: pointer;
  font-weight: 800;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  color: white;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 14px;
  
  /* Premium Neon Gradient */
  background: linear-gradient(
    135deg,
    #ff0080,
    #ff8c00,
    #40e0d0,
    #ff0080,
    #ff8c00
  );
  background-size: 400% 400%;
  animation: neonGradient 3s ease infinite, neonPulse 2s ease-in-out infinite alternate;
  
  /* Neon Glow Effect */
  box-shadow: 
    0 0 20px rgba(255, 0, 128, 0.5),
    0 0 40px rgba(255, 140, 0, 0.3),
    0 0 60px rgba(64, 224, 208, 0.2),
    inset 0 0 20px rgba(255, 255, 255, 0.1);
  
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.unlock-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.4),
    transparent
  );
  transition: 0.6s;
}

.unlock-btn:hover::before {
  left: 100%;
}

.unlock-btn:hover {
  transform: translateY(-3px) scale(1.02);
  animation: none;
  background: linear-gradient(
    135deg,
    #ff0080,
    #ff8c00,
    #40e0d0,
    #ff0080
  );
  background-size: 400% 400%;
  animation: neonGradient 1.5s ease infinite, neonPulseHover 0.5s ease-in-out infinite alternate;
  
  box-shadow: 
    0 0 30px rgba(255, 0, 128, 0.7),
    0 0 60px rgba(255, 140, 0, 0.5),
    0 0 90px rgba(64, 224, 208, 0.3),
    0 5px 20px rgba(0, 0, 0, 0.4),
    inset 0 0 25px rgba(255, 255, 255, 0.15);
}

.unlock-btn:active {
  transform: translateY(-1px) scale(1.01);
  box-shadow: 
    0 0 15px rgba(255, 0, 128, 0.6),
    0 0 30px rgba(255, 140, 0, 0.4),
    0 0 45px rgba(64, 224, 208, 0.2),
    0 2px 10px rgba(0, 0, 0, 0.3);
}

.unlock-btn.loading {
  pointer-events: none;
  animation: none;
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  box-shadow: 0 0 20px rgba(79, 70, 229, 0.5);
}

.unlock-btn.loading::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  top: 50%;
  left: 50%;
  margin: -10px 0 0 -10px;
  border: 2px solid transparent;
  border-top: 2px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.unlock-btn.success {
  animation: none;
  background: linear-gradient(135deg, #00ff88, #00ccff);
  box-shadow: 
    0 0 25px rgba(0, 255, 136, 0.6),
    0 0 50px rgba(0, 204, 255, 0.4);
}

.unlock-btn.success::before {
  content: '✓ ';
  position: static;
  background: none;
}

@keyframes neonGradient {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes neonPulse {
  0% {
    box-shadow: 
      0 0 20px rgba(255, 0, 128, 0.5),
      0 0 40px rgba(255, 140, 0, 0.3),
      0 0 60px rgba(64, 224, 208, 0.2),
      inset 0 0 20px rgba(255, 255, 255, 0.1);
  }
  100% {
    box-shadow: 
      0 0 25px rgba(255, 0, 128, 0.7),
      0 0 45px rgba(255, 140, 0, 0.5),
      0 0 65px rgba(64, 224, 208, 0.3),
      inset 0 0 25px rgba(255, 255, 255, 0.15);
  }
}

@keyframes neonPulseHover {
  0% {
    box-shadow: 
      0 0 30px rgba(255, 0, 128, 0.7),
      0 0 60px rgba(255, 140, 0, 0.5),
      0 0 90px rgba(64, 224, 208, 0.3),
      0 5px 20px rgba(0, 0, 0, 0.4),
      inset 0 0 25px rgba(255, 255, 255, 0.15);
  }
  100% {
    box-shadow: 
      0 0 35px rgba(255, 0, 128, 0.8),
      0 0 65px rgba(255, 140, 0, 0.6),
      0 0 95px rgba(64, 224, 208, 0.4),
      0 7px 25px rgba(0, 0, 0, 0.5),
      inset 0 0 30px rgba(255, 255, 255, 0.2);
  }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes bounce {
  0%, 20%, 53%, 80%, 100% {
    transform: translate3d(0,0,0);
  }
  40%, 43% {
    transform: translate3d(0,-8px,0);
  }
  70% {
    transform: translate3d(0,-4px,0);
  }
}

.unlock-btn.pulse {
  animation: pulse 0.5s ease-in-out;
}

.unlock-btn.bounce {

<script>
// --- API Configuration ---
const API_BASE = 'your api';
const FILES_API = `${API_BASE}/files_public.php`;
const SETTINGS_API = `${API_BASE}/settings_public.php`;

// --- Helper Functions ---
function showToast(msg, t=3000){
  const toastEl = document.getElementById('toast');
  toastEl.textContent = msg;
  toastEl.style.display='block';
  clearTimeout(toastEl._to);
  toastEl._to = setTimeout(()=>toastEl.style.display='none', t);
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// --- SIMPLE API Request Wrapper ---
async function simpleApiRequest(url) {
    try {
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        return data;
    } catch (error) {
        console.error('API Request Error:', error);
        return { success: false, message: error.message, data: [] };
    }
}
