<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unlimited Viral Video – Ads Unlock</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adexora.com/cdn/ads.js?id=650"></script>

<style>
body{margin:0;background:#0b1220;color:#fff;font-family:sans-serif}
.card{background:#0d1426;border:1px solid #1f2a44;border-radius:16px;padding:14px;margin:14px}
.thumb{width:100%;border-radius:12px}
.btn{padding:10px;border-radius:10px;border:0;font-weight:700}
.watch{background:#22d3ee}
.join{background:#22c55e}
.join[disabled]{background:#334155}
.progress{height:6px;background:#111;border-radius:99px;margin:8px 0}
.bar{height:100%;background:#22c55e;width:0}
</style>
</head>

<body>

<div id="posts"></div>

<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#22c55e;color:#000;padding:8px 12px;border-radius:8px;display:none">
</div>

<script>
/* ================= CONFIG ================= */
const REQUIRED = 10;

/* আলাদা আলাদা DEMO reward link */
const REWARD_LINKS = {
  p1:"https://example.com/demo1",
  p2:"https://example.com/demo2",
  p3:"https://example.com/demo3",
  p4:"https://example.com/demo4",
  p5:"https://example.com/demo5",
  p6:"https://example.com/demo6",
  p7:"https://example.com/demo7",
  p8:"https://example.com/demo8"
};

/* ================= POSTS ================= */
const POSTS = [
 {id:"p1",title:"Jannat Toha",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/images%20(99).jpeg"},
 {id:"p2",title:"Ridhii Moni",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/main/IMG_20251018_194758_066.jpg"},
 {id:"p3",title:"Era Moni",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/main/IMG_20251016_155725_290.jpg"},
 {id:"p4",title:"Othoi",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251112_172356_482.jpg"},
 {id:"p5",title:"Riddhi",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251112_173647_302.jpg"},
 {id:"p6",title:"Afrin Moni",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251112_174614_584.jpg"},
 {id:"p7",title:"Kids",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251015_011606_673.jpg"},
 {id:"p8",title:"Nadiya",img:"https://raw.githubusercontent.com/parvezparttoy/miniapp/refs/heads/main/IMG_20251119_084017_616.jpg"}
];

/* ================= HELPERS ================= */
const qs = s => document.querySelector(s);
function toast(msg){
 const t=qs("#toast");
 t.innerText=msg;
 t.style.display="block";
 setTimeout(()=>t.style.display="none",1500);
}

/* ================= ADS LOGIC ================= */
let adBusy=false;

function waitForAdexora(){
 return new Promise((res,rej)=>{
  let t=0;
  const i=setInterval(()=>{
   if(window.showAdexora){
    clearInterval(i);res();
   }
   t+=100;
   if(t>5000){clearInterval(i);rej();}
  },100);
 });
}

async function showAd(cardId){
 if(adBusy) return;
 adBusy=true;

 try{
  await waitForAdexora();
  await window.showAdexora(); // MUST COMPLETE

  let c = Number(localStorage.getItem("coin_"+cardId)||0);
  c++;
  localStorage.setItem("coin_"+cardId,c);

  updateUI(cardId,c);
  toast("+1 Ads Completed ✅");

 }catch{
  toast("Ad failed ❌");
 }
 adBusy=false;
}

/* ================= UI ================= */
function updateUI(id,c){
 const bar=qs("#bar_"+id);
 const w=qs("#watch_"+id);
 const j=qs("#join_"+id);
 bar.style.width=(c/REQUIRED*100)+"%";
 w.innerText=`Watch Ads (${c}/${REQUIRED})`;
 if(c>=REQUIRED){
  w.disabled=true;
  j.disabled=false;
 }
}

function render(){
 const box=qs("#posts");
 box.innerHTML="";
 POSTS.forEach(p=>{
  const c=Number(localStorage.getItem("coin_"+p.id)||0);
  box.innerHTML+=`
   <div class="card">
    <img class="thumb" src="${p.img}">
    <h3>${p.title}</h3>
    <div class="progress"><div class="bar" id="bar_${p.id}" style="width:${c/REQUIRED*100}%"></div></div>
    <button class="btn watch" id="watch_${p.id}" onclick="showAd('${p.id}')">
     Watch Ads (${c}/${REQUIRED})
    </button>
    <br><br>
    <button class="btn join" id="join_${p.id}" ${c<REQUIRED?"disabled":""}
     onclick="window.open(REWARD_LINKS['${p.id}'],'_blank')">
     Join / Reward
    </button>
   </div>
  `;
 });
}

render();
</script>

</body>
</html>
